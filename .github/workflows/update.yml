name: Update Server List

on:
  schedule:
    - cron: '*/30 * * * *'  # Запуск каждые 30 минут
  workflow_dispatch:        # Позволяет запустить скрипт вручную кнопкой на вкладке Actions

jobs:
  update-servers:
    runs-on: ubuntu-latest
    
    # Обязательные права для того, чтобы бот мог закоммитить и запушить filtered.txt
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Download and prepare Xray binary
        run: |
          mkdir -p xray_bin
          wget -O xray.zip https://github.com/XTLS/Xray-core/releases/download/v1.8.24/Xray-linux-64.zip
          unzip xray.zip -d xray_bin/
          chmod +x xray_bin/xray

      - name: Run update script
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: update.py  # Укажите точное имя файла с вашим скриптом, если оно отличается

      - name: Commit and push filtered list if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add filtered.txt
          git diff --staging --quiet || (git commit -m "Auto-update filtered servers [skip ci]" && git push)
