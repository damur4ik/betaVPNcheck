name: Update VPN Subscription
on:
  schedule:
    - cron: '*/30 * * * *'   # Запуск каждые 30 минут
  workflow_dispatch:          # Возможность запустить вручную

permissions:
  contents: write             # Права на запись (чтобы бот мог сохранять файл)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Xray
        run: |
          pip install requests requests[socks]
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip -d xray_bin
          chmod +x xray_bin/xray

      - name: Run filter script
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          IPINFO_TOKEN: "6cd80befed69e2"  # Ваш токен IPinfo (вписан прямо сюда)
        run: python filter.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add filtered.txt
          git diff --staged --quiet || git commit -m "Auto-update subscription"
          git pull --rebase origin main
          git push

      - name: Purge jsDelivr cache
        uses: List-KR/jsdelivr-purge@7.0.1
        with:
          urls: |
            https://cdn.jsdelivr.net/gh/damur4ik/betaVPNcheck@main/filtered.txt
