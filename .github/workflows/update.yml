name: Update VPN Subscription
on:
  schedule:
    - cron: '7,37 * * * *'   # Запуск в 7 и 37 минут каждого часа
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run filter script
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: python filter.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add filtered.txt
          git diff --staged --quiet || git commit -m "Auto-update subscription"
          git pull --rebase origin main
          git push

      - name: Purge jsDelivr cache
        uses: List-KR/jsdelivr-purge@7.0.1
        with:
          urls: |
            https://cdn.jsdelivr.net/gh/damur4ik/betaVPNcheck@main/filtered.txt
